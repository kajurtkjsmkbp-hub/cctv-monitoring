<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" class="rounded-xl">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#080d1a"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Outer Walls -->
  <rect x="50" y="40" width="700" height="420" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="12,4" opacity="0.6"/>

  <!-- Room 1: Entrance / Foyer (Zone 1) -->
  <rect x="50" y="280" width="220" height="180" fill="rgba(0, 240, 255, 0.03)" stroke="#00f0ff" stroke-width="2"/>
  <text x="70" y="320" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ZONE 1: MAIN ENTRANCE</text>
  <text x="70" y="340" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">GATE & FOYER</text>

  <!-- Room 2: Corridor & Main Hall (Zone 2) -->
  <rect x="270" y="160" width="260" height="300" fill="rgba(16, 185, 129, 0.03)" stroke="#10b981" stroke-width="2"/>
  <text x="290" y="200" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ZONE 2: CORRIDOR & HALL</text>
  <text x="290" y="220" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">CENTRAL ACCESSWAY</text>

  <!-- Room 3: Backyard & Perimeter (Zone 3) -->
  <rect x="530" y="40" width="220" height="220" fill="rgba(245, 158, 11, 0.03)" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="80" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ZONE 3: BACKYARD</text>
  <text x="550" y="100" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">PERIMETER BOUNDARY</text>

  <!-- Room 4: Driveway & Mikrotik Subnet (Zone 4) -->
  <rect x="530" y="260" width="220" height="200" fill="rgba(255, 0, 85, 0.03)" stroke="#ff0055" stroke-width="2"/>
  <text x="550" y="300" fill="#ff0055" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ZONE 4: DRIVEWAY</text>
  <text x="550" y="320" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">MIKROTIK 50.0/24</text>

  <!-- Office & Control Room -->
  <rect x="50" y="40" width="480" height="120" fill="rgba(0, 240, 255, 0.02)" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">SECURITY OPERATIONS & SERVER ROOM</text>
  <text x="70" y="100" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">SERVER: 192.168.1.81 | ROUTER: 192.168.1.64</text>

  <!-- Compass Rose -->
  <g transform="translate(710, 80)">
    <circle r="22" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <path d="M 0 -18 L 4 0 L -4 0 Z" fill="#00f0ff"/>
    <path d="M 0 18 L 4 0 L -4 0 Z" fill="#64748b"/>
    <text x="-4" y="-22" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">N</text>
  </g>
</svg>
